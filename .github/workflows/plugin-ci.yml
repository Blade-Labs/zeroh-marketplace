name: plugin-ci

# PRs verify proposed changes; main verifies integration. Feature pushes and release tags
# do not duplicate those runs. Releases must use the verified main commit.
# Run surviving behavior tests, Greenfield helper checks and packaging consistency.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/zeroh-roadmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install repository test dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: install Roadmap parser and schema dependencies
        run: npm ci --ignore-scripts
      - name: native core, Greenfield and packaging tests
        env:
          TEST_CONCURRENCY: "2"
        run: npm test
