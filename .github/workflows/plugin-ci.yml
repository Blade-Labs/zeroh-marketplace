name: plugin-ci

# PRs verify proposed changes; main verifies integration. Feature pushes and release tags
# do not duplicate those runs. Releases must use the verified main commit.
# Both retained gates run the complete fixture suite and protocol-load budget.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/zeroh-roadmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install repository test dependencies
        working-directory: .
        run: npm ci --ignore-scripts
      - name: install (zod + the tsx/ajv test devDeps)
        run: npm ci --ignore-scripts
      - name: plugin test tier (incl. the fixture-consumer wired suite)
        env:
          TEST_CONCURRENCY: "2"
        run: npm test
      - name: protocol-load budget (do-arc ≤ 12k tokens, measured)
        run: node bin/roadmap.mjs measure --flow do-arc --assert 12000
