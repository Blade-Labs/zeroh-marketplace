# Fake keys only, excluded so push protection does not block a release:
# - the plugin's tests feed the detector fakes built to look real
#   (sk_live_ZEROHFAKE…, ghp_ZEROHFAKE…); none is a working credential;
# - the vendored gitleaks rules and the rules generated from them carry
#   gitleaks' own allowlist of publicly known example keys.
paths-ignore:
  - "plugins/zeroh-disclosure/test/**"
  - "plugins/zeroh-disclosure/vendor/gitleaks/**"
  - "plugins/zeroh-disclosure/lib/rules/gitleaks.generated.json"
