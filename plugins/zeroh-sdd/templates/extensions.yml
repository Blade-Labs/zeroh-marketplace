# zeroh-sdd Default Extension Hooks
#
# Wires SDD enforcement skills into speckit phase transitions.
# This file ships with the plugin as a default template.
# Projects can customize by copying to .specify/extensions.yml.
#
# Hook types:
#   optional: true  -> prompts user with command suggestion
#   optional: false -> executes automatically (mandatory)

hooks:
  # -- After Plan: Shapes + Gate Design + Pattern Check --------
  after_plan:
    - extension: sdd-shapes
      command: speckit-shapes
      description: "Shape-gated development -- produce shape briefs then fill shapes as RED tests"
      optional: false
      prompt: "For each entity in plan.md + data-model.md, produce shape brief then fill shape. Shapes ARE the acceptance criteria."

    - extension: sdd-tdd
      command: criteria-first-tdd
      description: "Design CGTC gates per user story from the plan"
      optional: false
      prompt: "Apply criteria-first-tdd gate design to each user story. Assign gate types (convention/fitness/ceiling) and CGTC layers (L0-L3)."

    - extension: sdd-patterns
      command: patterns
      description: "Search-before-create check on all planned new files"
      optional: true
      prompt: "Run patterns skill on every new file in the plan. Verify extend-vs-create decisions."

  # -- Before Implement: Write RED Tests ----------------------
  before_implement:
    - extension: sdd-tdd
      command: criteria-first-tdd
      description: "Write RED tests from acceptance criteria before implementation begins"
      optional: false
      prompt: "For each task marked [RED] in tasks.md, write the failing test. Verify it FAILS before proceeding to [GREEN]."

  # -- After Implement: Wire-Check ----------------------------
  after_implement:
    - extension: sdd-wirecheck
      command: wire-check
      description: "Last-mile wiring health check -- verify all connections are real"
      optional: false
      prompt: "Run wire-check on all modified directories. All dimensions must be GREEN."
